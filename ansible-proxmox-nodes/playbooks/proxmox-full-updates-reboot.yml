---
- name: Atualizar completamente nodes Proxmox e reiniciar se necessário
  hosts: proxmox_nodes
  serial: "{{ serial_batch | default(1) }}"
  gather_facts: true
  become: true

  vars:
    reboot_connect_timeout: 20
    reboot_post_reboot_delay: 30
    reboot_timeout: 1800

  tasks:
    - name: Garantir que o host é Debian
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: "Este playbook foi feito para nodes Proxmox baseados em Debian."
        success_msg: "Host {{ inventory_hostname }} é Debian, seguindo com o full update."

    - name: Atualizar cache do apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"

    - name: Aplicar atualização completa de pacotes
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: full_upgrade_result

    - name: Verificar se o sistema pede reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Definir status final de reboot
      ansible.builtin.set_fact:
        reboot_required: "{{ reboot_required_file.stat.exists | default(false) }}"

    - name: Mostrar motivo do reboot quando houver
      ansible.builtin.command: cat /var/run/reboot-required.pkgs
      register: reboot_required_pkgs
      changed_when: false
      failed_when: false
      when: reboot_required

    - name: Exibir pacotes que motivaram reboot
      ansible.builtin.debug:
        msg: "{{ reboot_required_pkgs.stdout_lines | default([]) }}"
      when: reboot_required

    - name: Reiniciar node quando necessário
      ansible.builtin.reboot:
        msg: "Reboot automático após full update via Ansible"
        connect_timeout: "{{ reboot_connect_timeout }}"
        reboot_timeout: "{{ reboot_timeout }}"
        pre_reboot_delay: 5
        post_reboot_delay: "{{ reboot_post_reboot_delay }}"
        test_command: uptime
      when: reboot_required

    - name: Resumo da execução
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "SO: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Upgrade executado: {{ full_upgrade_result.changed | default(false) }}"
          - "Reboot necessário: {{ reboot_required }}"
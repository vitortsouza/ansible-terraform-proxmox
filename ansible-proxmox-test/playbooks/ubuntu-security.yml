---
- name: Atualizar VMs de teste
  hosts: test_vms
  become: true
  gather_facts: true

  tasks:
    - name: Atualizar cache do APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar unattended-upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present

    - name: Aplicar upgrades disponíveis
      ansible.builtin.apt:
        upgrade: safe

    - name: Verificar se reboot é necessário
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reiniciar se necessário
      ansible.builtin.reboot:
        reboot_timeout: 900
      when: reboot_required.stat.exists

---
- name: Descobrir node e tipo da VM pelo VMID
  ansible.builtin.set_fact:
    vm_resource: >-
      {{
        (
          cluster_resources.json.data
          | selectattr('vmid', 'defined')
          | selectattr('vmid', 'equalto', vm.proxmox_vmid)
          | list
          | first
        ) | default({}, true)
      }}

- name: Falhar se VMID não existir no cluster
  ansible.builtin.assert:
    that:
      - vm_resource is defined
      - vm_resource != ""
      - vm_resource.node is defined
      - vm_resource.type is defined
    fail_msg: "VMID {{ vm.proxmox_vmid }} ({{ vm.name }}) não foi encontrado em /cluster/resources"

- name: Definir endpoint de snapshot conforme tipo
  ansible.builtin.set_fact:
    snapshot_kind: "{{ 'qemu' if vm_resource.type == 'qemu' else 'lxc' }}"

- name: Listar snapshots da VM/CT
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ vm_resource.node }}/{{ snapshot_kind }}/{{ vm.proxmox_vmid }}/snapshot"
    method: GET
    validate_certs: "{{ proxmox_validate_certs | default(false) }}"
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
  register: proxmox_snapshots

- name: Definir snapshots candidatos pelo prefixo
  ansible.builtin.set_fact:
    snapshots_to_remove: >-
      {{
        proxmox_snapshots.json.data
        | selectattr('name', 'defined')
        | selectattr('name', 'search', snapshot_name_prefix)
        | map(attribute='name')
        | reject('equalto', 'current')
        | list
      }}

- name: Mostrar snapshots candidatos
  ansible.builtin.debug:
    msg:
      - "VM: {{ vm.name }}"
      - "Tipo: {{ vm_resource.type }}"
      - "Node: {{ vm_resource.node }}"
      - "Snapshots candidatos: {{ snapshots_to_remove }}"

- name: Remover snapshots encontrados
  community.proxmox.proxmox_snap:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    vmid: "{{ vm.proxmox_vmid }}"
    snapname: "{{ item }}"
    state: absent
    validate_certs: "{{ proxmox_validate_certs | default(false) }}"
  loop: "{{ snapshots_to_remove }}"
  when: snapshots_to_remove | length > 0
